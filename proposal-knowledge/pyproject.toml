[project]
name = "proposal-knowledge"
version = "0.1.0"
description = "Proposal catalog (MDM) and CV knowledge service with MCP (HTTP) endpoints"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "openpyxl>=3.1.0",
    "mcp>=2.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
proposal-knowledge = "proposal_knowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proposal_knowledge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
